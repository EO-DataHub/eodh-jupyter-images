name: Publish JupyterHub image

on:
  push:
    tags:
      - 'eodh-jupyter-hub-*'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.extract.outputs.tag }}
    steps:
      - id: extract
        run: echo "tag=${GITHUB_REF_NAME#eodh-jupyter-hub-}" >> "$GITHUB_OUTPUT"

  publish:
    needs: prepare
    uses: EO-DataHub/github-actions/.github/workflows/ecr-publish.yaml@main
    with:
      IMAGE_NAME: eodh-jupyter-hub
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      AWS_ECR_ALIAS: ${{ vars.AWS_ECR_ALIAS }}
      BUILD_CONTEXT: hub
    secrets: inherit
    permissions:
      id-token: write
      contents: read